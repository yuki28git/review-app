<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>ジャンル別IndexedDBページ（バックアップ機能付き）</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <nav class="nav">
    <ul id="headder">
      <li class="active" data-genre="映画">映画</li>
      <li data-genre="アニメ">アニメ</li>
      <li data-genre="ドラマ">ドラマ</li>
      <li data-genre="ゲーム">ゲーム</li>
    </ul>
  </nav>
  <div class="main">
    <aside class="sidebar">
      <p class="filter-title">フィルター</p>
      <div class="filter-group">
        <label for="keywordInput">キーワード</label>
        <input id="keywordInput" type="text" placeholder="作品名・キャラ名など">
      </div>
      <div class="filter-group" id="subGenreGroup">
        <label for="subGenreBtn">ジャンル</label>
        <button type="button" class="filter-label-btn" id="subGenreBtn">ジャンルを選択</button>
        <div class="filter-menu" id="subGenreMenu"></div>
      </div>
      <div class="filter-group" id="yearGroup">
        <label for="yearBtn" id="dateLabel">公開日</label>
        <button type="button" class="filter-label-btn" id="yearBtn">公開日（年）を選択</button>
        <div class="filter-menu" id="yearMenu"></div>
      </div>
      <div class="filter-group" id="voiceGroup">
        <label for="voiceBtn" id="voiceLabel">声優</label>
        <button type="button" class="filter-label-btn" id="voiceBtn">声優を選択</button>
        <div class="filter-menu" id="voiceMenu"></div>
      </div>
      <div class="filter-group" id="scoreGroup">
        <label for="scoreMinInput">点数（範囲指定）</label>
        <div style="display:flex;gap:12px;align-items:center; margin-top:4px;">
          <input id="scoreMinInput" type="number" min="0" max="100" value="0"
            style="width:60px; height: 8px; font-size: 1.18em; padding: 12px 10px; border-radius: 10px;"
            placeholder="最小値">
          <span style="font-size: 1.2em;">～</span>
          <input id="scoreMaxInput" type="number" min="0" max="100" value="100"
            style="width:60px; height: 8px; font-size: 1.18em; padding: 12px 10px; border-radius: 10px;"
            placeholder="最大値">
        </div>
        <p class="helper-text">0～100の範囲で指定できます。</p>
      </div>
      <div class="filter-actions">
        <button id="applyFilterBtn" type="button">適用</button>
        <button id="resetFilterBtn" type="button">リセット</button>
      </div>
      <hr style="margin:18px 0;">
      <div style="margin-top:20px;">
        <button id="backupBtn" type="button"
          style="width:100%;background:#1976d2;color:#fff;padding:12px 0;font-size:1.1em;border-radius:8px;">データバックアップ</button>
        <input type="file" id="restoreFile" accept=".json" style="display:none;">
        <button id="restoreBtn" type="button"
          style="width:100%;margin-top:9px;background:#43a047;color:#fff;padding:12px 0;font-size:1.1em;border-radius:8px;">バックアップから復元</button>
        <div id="backupMessage" style="font-size:13px;color:#1976d2;margin-top:8px;"></div>
      </div>
    </aside>
    <div id="content">
      <h2>データ一覧</h2>
      <button id="addRow">追加</button>
      <table id="dataTable">
        <thead>
          <tr>
            <th data-col="name">名前</th>
            <th data-col="memo">ジャンル</th>
            <th data-col="date" id="dateColumnHeader">公開日</th>
            <th data-col="value">点数</th>
            <th class="operation">操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div id="detailPanel">
        <div id="detailContent"></div>
      </div>
    </div>
  </div>
  <script src="main.js"></script>
</body>

</html>
